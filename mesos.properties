# MesOS release identity — the single source of truth for version information.
#
# Every version string shown by MesOS (About MesOS, update checks, APK metadata,
# GitHub release names) is derived from these values. Do not hard-code version
# strings anywhere else; change them here.
#
# mesos.version.name   Human-readable release number, e.g. 0.1, 0.1.1, 0.2
# mesos.version.code   Monotonic integer. MUST increase with every release that
#                      is delivered as an update (Android rejects downgrades).
# mesos.version.label  Release label appended to the name, e.g. "Developer Preview".
# mesos.channel        Release channel: developer | beta | stable
#
# The build number is not stored here: it comes from the MESOS_BUILD_NUMBER
# environment variable (set by CI) and defaults to "local" for developer builds.

mesos.version.name=0.3
mesos.version.code=4
mesos.version.label=Developer Preview
mesos.channel=developer

# Update source. The updater reads this manifest over HTTPS; the release workflow
# publishes it as an asset of every GitHub release (see docs/UPDATES.md).
mesos.update.manifestUrl=https://github.com/Meslanaa/Espor/releases/latest/download/mesos-update.json
# Oldest installed version code that may update directly to this release.
mesos.update.minimumSupportedVersion=1
